<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>ZarPulse Player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{width:100%;height:100%}</style></head><body><div id="p"></div>
<script>
var q=new URLSearchParams(location.search),V=(q.get("v")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,11),S=parseInt(q.get("start")||"0",10)||0,played=false,pl=null;
function tell(s,x){try{var m={zpYt:s,v:V};if(x)for(var k in x)m[k]=x[k];parent.postMessage(m,"*")}catch(e){}}
window.onYouTubeIframeAPIReady=function(){if(!V){tell("error",{code:"noid"});return}
 pl=new YT.Player("p",{videoId:V,playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,start:S,origin:location.origin},
 events:{onReady:function(e){try{e.target.unMute();e.target.setVolume(100);e.target.playVideo()}catch(x){}tell("ready")},
  onError:function(e){tell("error",{code:e&&e.data})},
  onStateChange:function(e){if(e.data===1){played=true;tell("playing")}if(e.data===0)tell("ended")}}})};
setInterval(function(){try{if(played&&pl&&pl.getCurrentTime)tell("t",{t:pl.getCurrentTime()})}catch(e){}},5000);
var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=function(){tell("error",{code:"api"})};document.head.appendChild(s);
setTimeout(function(){if(!played)tell("error",{code:"timeout"})},25000);
</script></body></html>
